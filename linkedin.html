<!doctype html>
<html>
    <head>
        <title>LinkedinClone</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
        <style>
            .img{
                margin-left:800px;
                margin-top:-650px;
            }
            .content{
                margin-top:150px;
                margin-left:150px;
                font-size: 25px;
                color: rgb(28, 27, 27)
                font-family="times new roman";
            }
            .buttons{
                margin-left:150px;
                width:300px;
            }
            .google{
                background-color: #0064d0;
                color:white;
                font-size:18px;
                width:400px;
                height:40px;
                border:none;
                outline:none;
                border-radius:20px;
                padding-top:-30px;
                
            }
            .google:hover{
            background-color: #518dcd;
            }
            .gimg{
                border-radius: 100px;
            }
            .msoft{
                font-size: 20px;
                margin-top:25px;
                width:400px;
                height:40px;
                border-radius: 20px;
                background-color: white;
            }
            .msoft:hover{
                 background-color: rgb(240, 236, 236);
            }
            .mimag{
                border-radius:100px;
            }
             .email{
                text-align:center;
                margin-top:25px;
                width:400px;
                height:40px;
                background-color: white;
                border-radius: 20px;
                color:rgb(53, 53, 53);
                font-size:20px;
            }
            .email:hover{
                color:black;
                background-color:rgb(240, 236, 236) ;
            }
            .mainnav{
                margin-top:20px;
            }
            .ln{
                color:#0064d0;
                margin-left:200px;
                
            }
            .in{
                font-size: 40px;
                color:#0064d0;
                margin-left:290px;
                margin-top:-62px;
            }
            .sidenav{
                margin-left:520px;
                margin-top:-5px;
            }
            .icnav{
                margin-left:600px;
                margin-top:-60px;
                padding-left:20px;
            }
            .icnav:hover{
                color: black;
            }
            .icons{
                color:rgb(106, 103, 103);
                font-size: 20px;                  
            }
            .icons figcaption{
                color:rgb(82, 82, 82);
                font-size: 10px;
            }
            .btns{
                margin-left:1100px;
                margin-top:-70px;
            }
            .signin{
                
        
                width:100px;
                padding:15px;
                color:#0064d0;
                border-color: #0064d0;
                outline-color:#0064d0;
                background-color: white;
                border-radius:30px;
            }
            .join{
        
                width:100px;
                padding:15px;
                border:none;
                outline:none;
                background-color: #0064d0;
                color:white;
                border-radius: 30px;
            }
            .end{
                width:500px;
                margin-left:100px;
                margin-top:-290px;
                text-align:center;
                font-size:13px;
                color:grey;
            }
            .end a{
                 text-decoration: none;
                 color:#0064d0;
            }
            .end a:hover{
                text-decoration: underline;
            }
            .end1{
                color:rgb(29, 30, 30);
                margin-left:250px;
                margin-top:50px;
                font-size:13px;
            }
            .end2{
                color:#0064d0;
                margin-left:370px;
                margin-top:-40px;
            }
        </style>
    </head>
    <body>
        <nav class="mainnav">
            <h1 class="ln">Linked</h1>
            <div class="in">
            <i class="fa-brands fa-linkedin"></i>
            </div>
            <table class='icnav'  cellpadding='20px'>
                 <tr class='icons'>
                 <td><i class="fa-solid fa-rocket"></i><figcaption>Top Content</figcaption></td>
                 <td><i class="fa-solid fa-user-group"></i><figcaption>People</figcaption></td>
                 <td><i class="fa-regular fa-square-caret-right"></i><figcaption>Learning</figcaption></td>
                 <td><i class="fa-solid fa-briefcase"></i><figcaption>Jobs</figcaption></td>
                 <td><i class="fa-solid fa-puzzle-piece"></i><figcaption>Games</figcaption></td>
                 <td><i class="fa-solid fa-laptop"></i><figcaption>Get the app</figcaption></td>
                 </tr>
            </table>
            <div class='btns'>
                 <button class="signin">Sign in</button>
                 <button class="join">Join now</button>
            </div>
        </nav>
        <div class="content">
            <h1>Welcome to your<br>professional network</h1>
        </div>
        <div class="buttons">
            <button class="google"><img src="https://freelogopng.com/images/all_img/1657952641google-logo-png-image.png" width="20" height ="20" class='gimg'> Continue with Google</button>
            <button class="msoft"><img src="https://cdn.iconscout.com/icon/free/png-512/microsoft-2752121-2284938.png" width='20' height='20' class='mimg'>Continue with Microsoft</button>
            <button class="email">Sign with email</button>
        </div>
        <div class='img'>
            <img src="https://static.licdn.com/aero-v1/sc/h/dxf91zhqd2z6b0bwg85ktm5s4" height=950 width=700>
        </div>
        <div class="end">
            <p>By clicking Continue to join or sign in, you agree to LinkedIn’s <a href="">User<br>
                Agreement,</a> <a href="">Privacy Policy</a> and <a href="">Cookie Policy.</a>
            </p>
        </div>
        <div class="end1">
            <h3>New to LinkedIn?</h3>
        </div>
        <div class="end2">
            <h3>Join now</h3>
        </div>
    </body>
</html>
